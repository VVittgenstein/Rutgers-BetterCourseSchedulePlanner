[workspace]
members = [
    "crates/bcsp-contracts",
    "crates/bcsp-domain",
    "crates/bcsp-query",
    "crates/bcsp-rutgers-client",
    "crates/bcsp-operational-storage",
    "crates/bcsp-catalog",
    "crates/bcsp-open",
    "crates/bcsp-watch",
    "crates/bcsp-application",
    "crates/bcsp-local-user-state",
    "crates/bcsp-local-runtime",
    "crates/bcsp-public-operations",
    "crates/bcsp-public-runtime",
    "apps/bcsp-local",
    "apps/bcsp-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "ISC"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["gzip", "json", "query", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["compression-gzip", "fs", "limit", "trace"] }
tracing = { version = "=0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
thiserror = "=2.0.18"
sha2 = { version = "=0.10.9", default-features = false }
uuid = { version = "=1.23.5", default-features = false, features = ["serde", "std", "v4"] }
time = { version = "=0.3.53", default-features = false, features = ["formatting", "macros", "parsing", "serde", "std"] }
jiff = { version = "=0.2.32", default-features = false, features = ["serde", "std", "tzdb-bundle-always"] }
open = { version = "=5.4.0", default-features = false }
include_dir = { version = "=0.7.4", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["bit-set", "std"] }
tempfile = "=3.27.0"

[workspace.metadata.p7.tooling]
cargo-deny = "0.20.2"
cargo-about = "0.9.1"
cargo-cyclonedx = "0.5.9"
