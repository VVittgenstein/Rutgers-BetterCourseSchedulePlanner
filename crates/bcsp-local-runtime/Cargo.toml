[package]
name = "bcsp-local-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Harness-free on purpose: this target is BOTH the packaging fixture seeder
# the release rehearsal invokes with arguments and, run with none, its own
# negative control. `cargo test` runs the second half; the release script
# runs the first against a real candidate. It is a test artifact and never
# enters the twelve-file archive.
[[test]]
name = "desired_watch_fixture"
path = "tests/desired_watch_fixture.rs"
harness = false

[dependencies]
bcsp-application = { version = "=0.1.0", path = "../bcsp-application" }
bcsp-contracts = { version = "=0.1.0", path = "../bcsp-contracts" }
bcsp-domain = { version = "=0.1.0", path = "../bcsp-domain" }
bcsp-local-user-state = { version = "=0.1.0", path = "../bcsp-local-user-state" }
bcsp-open = { version = "=0.1.0", path = "../bcsp-open" }
bcsp-operational-storage = { version = "=0.1.0", path = "../bcsp-operational-storage" }
bcsp-watch = { version = "=0.1.0", path = "../bcsp-watch" }
include_dir.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bcsp-catalog = { version = "=0.1.0", path = "../bcsp-catalog" }
bcsp-rutgers-client = { version = "=0.1.0", path = "../bcsp-rutgers-client" }
rusqlite.workspace = true
tempfile.workspace = true
