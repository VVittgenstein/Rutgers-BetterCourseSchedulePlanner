name: Product build and packaging

on:
  push:
    paths:
      - '.github/workflows/public-ops.yml'
      - 'deploy/public/**'
      - 'apps/bcsp-local/**'
      - 'apps/bcsp-server/**'
      - 'crates/**'
      - 'frontend/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'packaging/**'
      - 'rust-toolchain.toml'
      - 'tools/architecture/**'
      - 'tools/public-ops/**'
  pull_request:
    paths:
      - '.github/workflows/public-ops.yml'
      - 'deploy/public/**'
      - 'apps/bcsp-local/**'
      - 'apps/bcsp-server/**'
      - 'crates/**'
      - 'frontend/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'packaging/**'
      - 'rust-toolchain.toml'
      - 'tools/architecture/**'
      - 'tools/public-ops/**'
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full source commit to package (40 or 64 lowercase hexadecimal characters)
        required: true
        type: string
      run_soak:
        description: Run the 600-second public soak gate (P2/H9) instead of the iteration package
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: product-packaging-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  packaging-contracts:
    if: github.event_name != 'workflow_dispatch'
    name: Packaging contract checks (no candidate build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select the metadata parser runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Validate shell and metadata scripts
        shell: bash
        run: |
          find deploy/public packaging/linux -type f -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n
          shellcheck --severity=error -x -P SCRIPTDIR packaging/linux/*.sh
          node --check packaging/generate-release-metadata.mjs
          node --check packaging/tests/final-candidate-browser.mjs
          node --check packaging/tests/real-world-browser.mjs
          node --check packaging/tests/public-soak-browser.mjs

      # P2 hardening: the frozen deploy lines, the soak arithmetic, and the
      # ops-script judgments are all provable without a build. The two shell
      # suites run the REAL ops scripts against recording stubs under a
      # temporary root; upgrade-noop needs the symlinks this runner has.
      - name: Verify the public deploy and soak contracts
        shell: bash
        run: |
          node tools/public-ops/verify-deploy-contracts.mjs
          node packaging/tests/public-soak-browser.mjs --self-test
          bash deploy/public/tests/preflight-check.sh
          bash deploy/public/tests/upgrade-noop.sh

      # The capability policy is only a policy if something runs it. Every
      # surface it governs runs here: the Rust suites below, the frontend
      # source/bundle/manifest suites, and the release-set gate's fixture
      # self-test. All are pure functions over in-memory fixtures plus the
      # real deny document -- no cargo, no build, no archive. The frontend
      # workflow-contract test in verify-target-build.test.mjs pins these
      # entries, so deleting any of them fails the next run.
      - name: Verify the public capability policy contracts
        shell: bash
        run: |
          node tools/architecture/verify-rust-graph.test.mjs
          node tools/architecture/verify-public-rust-zero-surface.test.mjs

      - name: Install the frontend guard toolchain
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Verify the frontend capability policy contracts
        shell: bash
        working-directory: frontend
        run: |
          npm run guard:imports
          npm run test:guard

      - name: Self-test the release-set capability gate
        shell: pwsh
        run: ./packaging/verify-release-set.ps1 -SelfTest

      - name: Parse PowerShell packaging scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'packaging/windows/build.ps1',
            'packaging/windows/verify.ps1',
            'packaging/verify-release-set.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "$file failed to parse: $($errors | Out-String)"
            }
          }

  linux-iteration-package:
    if: github.event_name == 'workflow_dispatch' && !inputs.run_soak
    name: Linux-only iteration package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RUSTUP_TOOLCHAIN: 1.97.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the requested source identity
        run: |
          [[ "$REQUESTED_SOURCE_COMMIT" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
            printf '%s\n' 'source_commit must be a full lowercase hexadecimal commit id' >&2
            exit 2
          }

      - name: Check out the exact requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm the detached, clean checkout and prepare the frozen source
        id: source
        run: |
          actual_commit="$(git rev-parse --verify HEAD)"
          test "$actual_commit" = "$REQUESTED_SOURCE_COMMIT"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            printf '%s\n' 'the requested source checkout is not detached' >&2
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"

          source_root="$RUNNER_TEMP/rbcsp-source"
          test ! -e "$source_root"
          git worktree add --detach "$source_root" "$actual_commit"
          test "$(git -C "$source_root" rev-parse --verify HEAD)" = "$actual_commit"
          if git -C "$source_root" symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            printf '%s\n' 'the frozen source worktree is not detached' >&2
            exit 1
          fi
          test -z "$(git -C "$source_root" status --porcelain --untracked-files=all)"

          source_date_epoch="$(git -C "$source_root" show -s --format=%ct "$actual_commit")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          printf 'source_root=%s\n' "$source_root" >> "$GITHUB_OUTPUT"
          printf 'source_date_epoch=%s\n' "$source_date_epoch" >> "$GITHUB_OUTPUT"
          printf 'short_commit=%s\n' "${actual_commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Select the locked Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install the locked package build tools
        run: |
          npm install --global npm@11.16.0
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-unknown-linux-gnu
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'
          test "$(rustc --version | awk '{print $2}')" = '1.97.0'
          test "$(cargo --version | awk '{print $2}')" = '1.97.0'
          test "$(cargo-about --version)" = 'cargo-about 0.9.1'
          test "$(cargo-cyclonedx cyclonedx --version)" = \
            'cargo-cyclonedx-cyclonedx 0.5.9'

      - name: Validate the Linux packaging inputs
        run: |
          find packaging/linux -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          shellcheck --severity=error -x -P SCRIPTDIR packaging/linux/*.sh
          node --check packaging/generate-release-metadata.mjs
          node tools/architecture/verify-public-rust-zero-surface.mjs

      - name: Build and verify the exact Linux package once
        id: candidate
        run: |
          output_root="$RUNNER_TEMP/rbcsp-release"
          source_root='${{ steps.source.outputs.source_root }}'
          build_root="$GITHUB_WORKSPACE/.cache/product-build/linux"
          cargo fetch --locked --manifest-path "$source_root/Cargo.toml"
          bash packaging/linux/build.sh \
            --source-root "$source_root" \
            --source-commit "$REQUESTED_SOURCE_COMMIT" \
            --output-root "$output_root" \
            --build-root "$build_root"
          archive="$output_root/rbcsp-linux-x86_64-0.1.2.tar.gz"
          archive_hash="$(sha256sum "$archive" | awk '{print $1}')"
          archive_bytes="$(stat -c '%s' "$archive")"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$archive_hash" >> "$GITHUB_OUTPUT"
          printf 'bytes=%s\n' "$archive_bytes" >> "$GITHUB_OUTPUT"
          {
            printf '### Linux iteration package\n\n'
            printf -- '- Source commit: `%s`\n' "$REQUESTED_SOURCE_COMMIT"
            printf -- '- Source date epoch: `%s`\n' '${{ steps.source.outputs.source_date_epoch }}'
            printf -- '- SHA-256: `%s`\n' "$archive_hash"
            printf -- '- Bytes: `%s`\n' "$archive_bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: rbcsp-linux-x86_64-0.1.2-${{ steps.source.outputs.short_commit }}
          path: ${{ steps.candidate.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # P2 hardening H9, CORE HALF ONLY: the 600-second real-stack soak.
  # Manual, and only on explicit request: it builds the archive from the
  # requested commit, installs it as the real systemd service behind a real
  # Caddy, and holds one browser WebSocket across a mid-soak forced
  # `caddy reload`. The composition tier (real Rutgers data) is NOT run
  # here -- it stays a separately authorized manual invocation of
  # tests/public-soak.sh, and only THAT run may claim the full
  # P2_H9_PUBLIC_SOAK_PASS. This job accepts exactly the CORE_PASS marker.
  linux-public-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak
    name: Linux public 600s CORE soak (P2/H9 core; composition pending)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RUSTUP_TOOLCHAIN: 1.97.0
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      CADDY_VERSION: 2.11.4
      CADDY_LINUX_AMD64_SHA256: 527fbf917c39189a1e3b31d34fa955601680b2d5c8055d2a87b8b9588dec7bb9
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the requested source identity
        run: |
          [[ "$REQUESTED_SOURCE_COMMIT" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
            printf '%s\n' 'source_commit must be a full lowercase hexadecimal commit id' >&2
            exit 2
          }

      - name: Check out the exact requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm the detached, clean checkout and prepare the frozen source
        id: source
        run: |
          actual_commit="$(git rev-parse --verify HEAD)"
          test "$actual_commit" = "$REQUESTED_SOURCE_COMMIT"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            printf '%s\n' 'the requested source checkout is not detached' >&2
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"

          source_root="$RUNNER_TEMP/rbcsp-source"
          test ! -e "$source_root"
          git worktree add --detach "$source_root" "$actual_commit"
          test "$(git -C "$source_root" rev-parse --verify HEAD)" = "$actual_commit"
          test -z "$(git -C "$source_root" status --porcelain --untracked-files=all)"
          printf 'source_root=%s\n' "$source_root" >> "$GITHUB_OUTPUT"

      - name: Select the locked Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install the locked package build tools
        run: |
          npm install --global npm@11.16.0
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-unknown-linux-gnu
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'

      - name: Install the soak host tools and the real browser
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl jq libnss3-tools sqlite3
          caddy_archive="$RUNNER_TEMP/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$caddy_archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$CADDY_LINUX_AMD64_SHA256" "$caddy_archive" \
            | sha256sum --check --strict
          tar -xzf "$caddy_archive" -C "$RUNNER_TEMP" caddy
          sudo install -m 0755 "$RUNNER_TEMP/caddy" /usr/local/bin/caddy
          caddy version
          test "$(caddy version | awk '{ print $1 }')" = "v${CADDY_VERSION}"
          npm ci --prefix frontend --no-audit --no-fund
          frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Build and verify the exact Linux package once
        id: candidate
        run: |
          output_root="$RUNNER_TEMP/rbcsp-release"
          source_root='${{ steps.source.outputs.source_root }}'
          build_root="$GITHUB_WORKSPACE/.cache/product-build/linux"
          cargo fetch --locked --manifest-path "$source_root/Cargo.toml"
          bash packaging/linux/build.sh \
            --source-root "$source_root" \
            --source-commit "$REQUESTED_SOURCE_COMMIT" \
            --output-root "$output_root" \
            --build-root "$build_root"
          printf 'archive=%s\n' "$output_root/rbcsp-linux-x86_64-0.1.2.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Run the 600-second CORE soak against the real stack
        run: |
          candidate_root="$RUNNER_TEMP/rbcsp-candidate"
          mkdir -p -- "$candidate_root"
          tar -xzf '${{ steps.candidate.outputs.archive }}' -C "$candidate_root" \
            --no-same-owner --no-same-permissions
          sudo env \
            BCSP_PUBLIC_SOAK_CONFIRM=YES \
            BCSP_PLAYWRIGHT_ROOT="$GITHUB_WORKSPACE/frontend" \
            BCSP_NODE_BIN="$(command -v node)" \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            bash deploy/public/tests/public-soak.sh --candidate-root "$candidate_root" \
            | tee "$RUNNER_TEMP/soak-output.txt"
          # CORE_PASS exactly: this job never runs the composition tier, so
          # the full-H9 marker appearing here would itself be a harness bug.
          grep -q '^P2_H9_PUBLIC_SOAK_CORE_PASS ' "$RUNNER_TEMP/soak-output.txt"
          if grep -q '^P2_H9_PUBLIC_SOAK_PASS ' "$RUNNER_TEMP/soak-output.txt"; then
            printf '%s\n' 'the harness claimed a full H9 pass without the composition tier' >&2
            exit 1
          fi
          {
            printf '### Linux public 600s CORE soak (P2/H9 core half)\n\n'
            printf -- '- Source commit: `%s`\n' "$REQUESTED_SOURCE_COMMIT"
            printf -- '- Result: `%s`\n' \
              "$(grep '^P2_H9_PUBLIC_SOAK_CORE_PASS ' "$RUNNER_TEMP/soak-output.txt")"
            printf -- '- Composition tier: `PENDING_EXTERNAL_AUTHORIZATION` (not run in CI)\n'
          } >> "$GITHUB_STEP_SUMMARY"
