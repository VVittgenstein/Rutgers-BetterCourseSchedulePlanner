name: Candidate build and verification

# P7.5 candidate reset: prior real-world acceptance was invalidated by ordinary-user testing.

on:
  push:
    paths:
      - '.github/workflows/public-ops.yml'
      - 'deploy/public/**'
      - 'apps/bcsp-server/**'
      - 'crates/**'
      - 'frontend/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'packaging/about.toml'
      - 'packaging/generate-release-metadata.mjs'
      - 'packaging/licenses/**'
      - 'packaging/linux/**'
      - 'packaging/windows/**'
      - 'packaging/release-inputs.json'
      - 'packaging/tests/**'
      - 'rust-toolchain.toml'
      - 'tools/architecture/**'
  pull_request:
    paths:
      - '.github/workflows/public-ops.yml'
      - 'deploy/public/**'
      - 'apps/bcsp-server/**'
      - 'crates/**'
      - 'frontend/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'packaging/about.toml'
      - 'packaging/generate-release-metadata.mjs'
      - 'packaging/licenses/**'
      - 'packaging/linux/**'
      - 'packaging/windows/**'
      - 'packaging/release-inputs.json'
      - 'packaging/tests/**'
      - 'rust-toolchain.toml'
      - 'tools/architecture/**'
  workflow_dispatch:
    inputs:
      p75_linux_real_world:
        description: Run the frozen Linux candidate against the real Rutgers Catalog
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.p75_linux_real_world }}

jobs:
  disposable-ubuntu:
    if: github.event_name != 'workflow_dispatch' || !inputs.p75_linux_real_world
    name: Linux package, Caddy, and synthetic browser verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select the locked Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install disposable-host tools
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 0755 /usr/sbin/policy-rc.d
          trap 'sudo rm -f /usr/sbin/policy-rc.d' EXIT
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils ca-certificates caddy file gzip jq libnss3-tools shellcheck sqlite3
          npm install --global npm@11.16.0
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'

      - name: Install the pinned Rust build and metadata tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-unknown-linux-gnu
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          test "$(rustc --version | awk '{print $2}')" = '1.97.0'
          test "$(cargo --version | awk '{print $2}')" = '1.97.0'
          test "$(cargo-about --version)" = 'cargo-about 0.9.1'
          test "$(cargo-cyclonedx cyclonedx --version)" = \
            'cargo-cyclonedx-cyclonedx 0.5.9'

      - name: Validate public package inputs
        run: |
          find deploy/public -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find packaging/linux -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          shellcheck -x -P SCRIPTDIR deploy/public/ops/*.sh deploy/public/tests/*.sh
          shellcheck --severity=error -x -P SCRIPTDIR packaging/linux/*.sh
          node --check packaging/generate-release-metadata.mjs
          node --check packaging/tests/real-world-browser.mjs
          node tools/architecture/verify-public-rust-zero-surface.mjs

      - name: Build and verify the frozen 20-file Linux package
        id: candidate
        run: |
          source_root="$RUNNER_TEMP/rbcsp-frozen-source"
          output_root="$RUNNER_TEMP/rbcsp-release"
          candidate="$RUNNER_TEMP/bcsp-public-candidate"
          git worktree add --detach "$source_root" \
            554c6cafcfaae59eaf3835cabfb4063d1e04b41f
          cargo fetch --locked --manifest-path "$source_root/Cargo.toml"
          bash packaging/linux/build.sh \
            --source-root "$source_root" \
            --output-root "$output_root"
          archive="$output_root/rbcsp-linux-x86_64-0.1.0.tar.gz"
          actual_hash="$(sha256sum "$archive" | awk '{print $1}')"
          actual_bytes="$(stat -c '%s' "$archive")"
          printf 'Linux candidate SHA256: %s\n' "$actual_hash"
          printf 'Linux candidate bytes: %s\n' "$actual_bytes"
          test "$actual_hash" = \
            '6d1f5a14d15459f418910935ee62012d1168a63fc69ff04dbac66e02d7c31d2b'
          bash packaging/linux/verify.sh --archive "$archive"
          install -d "$candidate"
          tar -xzf "$archive" -C "$candidate" --no-same-owner
          test "$(find "$candidate" -type f | wc -l)" -eq 20
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'source_root=%s\n' "$source_root" >> "$GITHUB_OUTPUT"

      - name: Install the candidate browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: >-
          "${{ steps.candidate.outputs.source_root }}/frontend/node_modules/.bin/playwright"
          install --with-deps chromium

      - name: Rehearse install, restore, upgrade, and rollback
        run: >-
          sudo env BCSP_DISPOSABLE_HOST_CONFIRM=YES BCSP_CI_NO_RUTGERS=1
          BCSP_BROWSER_ACCEPTANCE_SCRIPT="$GITHUB_WORKSPACE/packaging/tests/final-candidate-browser.mjs"
          BCSP_PLAYWRIGHT_ROOT="${{ steps.candidate.outputs.source_root }}/frontend"
          BCSP_NODE_BIN="$(command -v node)"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright"
          bash deploy/public/tests/disposable-host.sh
          --candidate-root "${{ steps.candidate.outputs.candidate }}"

      - name: Upload the verified Linux deployment package
        uses: actions/upload-artifact@v4
        with:
          name: rbcsp-linux-x86_64-0.1.0
          path: ${{ steps.candidate.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve the verified Linux candidate for the manual real-world tier
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.candidate.outputs.archive }}
          key: >-
            p7-5-linux-candidate-6d1f5a14d15459f418910935ee62012d1168a63fc69ff04dbac66e02d7c31d2b-${{ github.run_id }}-${{ github.run_attempt }}

  windows-candidate:
    if: github.event_name != 'workflow_dispatch' || !inputs.p75_linux_real_world
    name: Windows package and synthetic browser verification
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.0
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select the locked Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install the pinned Windows build and metadata tools
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-pc-windows-msvc
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ((node --version) -cne 'v24.18.0') { throw 'Unexpected Node version.' }
          if ((npm --version) -cne '11.16.0') { throw 'Unexpected npm version.' }
          if ((rustc --version).Split(' ')[1] -cne '1.97.0') { throw 'Unexpected rustc version.' }
          if ((cargo --version).Split(' ')[1] -cne '1.97.0') { throw 'Unexpected cargo version.' }
          if ((cargo-about --version) -cne 'cargo-about 0.9.1') { throw 'Unexpected cargo-about version.' }
          if ((cargo-cyclonedx cyclonedx --version) -cne 'cargo-cyclonedx-cyclonedx 0.5.9') {
            throw 'Unexpected cargo-cyclonedx version.'
          }

      - name: Build and freeze the Windows candidate
        id: windows_candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $ciRoot = 'C:\rbcsp-final-candidate'
          $toolRoot = Join-Path $ciRoot 'tools'
          $sourceRoot = Join-Path $ciRoot 'source'
          $outputRoot = Join-Path $ciRoot 'release'
          if (Test-Path -LiteralPath $ciRoot) {
            Remove-Item -LiteralPath $ciRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $ciRoot | Out-Null
          & icacls.exe $ciRoot /inheritance:r /grant:r `
            '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX'
          if ($LASTEXITCODE -ne 0) { throw 'Could not establish the clean-root ACL.' }

          git -c core.autocrlf=false worktree add --detach $toolRoot $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the candidate tool worktree.' }
          git -c core.autocrlf=false worktree add --detach $sourceRoot `
            554c6cafcfaae59eaf3835cabfb4063d1e04b41f
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the frozen source worktree.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          if (-not $vsRoot) { throw 'Visual Studio 2022 C++ tools were not found.' }
          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          $environment = @(& $env:ComSpec /d /s /c (
            '"' + $vcvars + '" -vcvars_ver=14.44 >nul && set'
          ))
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the MSVC environment.' }
          foreach ($line in $environment) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) {
              [Environment]::SetEnvironmentVariable(
                $line.Substring(0, $separator), $line.Substring($separator + 1), 'Process'
              )
            }
          }
          if ($env:VCToolsVersion -cne '14.44.35207') {
            throw "Unexpected MSVC tools: $($env:VCToolsVersion)"
          }
          if ($env:WindowsSDKVersion -cne '10.0.26100.0\') {
            throw "Unexpected Windows SDK: $($env:WindowsSDKVersion)"
          }
          $dumpbin = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\dumpbin.exe'

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $toolRoot 'packaging\windows\build.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw 'Windows builder did not parse under PowerShell 5.1.' }

          cargo fetch --locked --manifest-path (Join-Path $sourceRoot 'Cargo.toml')
          & (Join-Path $toolRoot 'packaging\windows\build.ps1') `
            -SourceRoot $sourceRoot -OutputRoot $outputRoot
          $archive = Join-Path $outputRoot 'rbcsp-windows-x86_64-0.1.0.zip'
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $archive).Length
          Write-Host "Windows candidate SHA256: $hash"
          Write-Host "Windows candidate bytes: $bytes"
          if ($hash -cne '87d9b1dfc788846f4eff1518b0e1ec41ac699ef4ba979cdcda944c5a89f4d9b5') {
            throw "The Windows candidate hash drifted: $hash"
          }
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "archive=$archive`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "dumpbin=$dumpbin`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "source_root=$sourceRoot`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tool_root=$toolRoot`n", $utf8)

      - name: Verify package boundaries with an isolated Windows account
        run: |
          $ErrorActionPreference = 'Stop'
          $userName = 'bcsp-ci-user'
          $plainPassword = [Guid]::NewGuid().ToString('N') + 'aA1!'
          $securePassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force
          $credential = New-Object Management.Automation.PSCredential(
            "$env:COMPUTERNAME\$userName", $securePassword
          )
          $userRoot = 'C:\rbcsp-standard-user'
          $readOnlyRoot = 'C:\rbcsp-final-candidate\read-only-package'
          try {
            $acceptanceUser = New-LocalUser -Name $userName -Password $securePassword `
              -AccountNeverExpires -PasswordNeverExpires
            $usersGroup = Get-LocalGroup -SID 'S-1-5-32-545'
            $usersMember = @(Get-LocalGroupMember -Group $usersGroup | Where-Object {
              $_.SID -eq $acceptanceUser.SID
            })
            if ($usersMember.Count -eq 0) {
              Add-LocalGroupMember -Group $usersGroup -Member $acceptanceUser
            }
            $administratorMember = @(Get-LocalGroupMember -SID 'S-1-5-32-544' | Where-Object {
              $_.SID -eq $acceptanceUser.SID
            })
            if ($administratorMember.Count -ne 0) {
              throw 'The acceptance account unexpectedly belongs to Administrators.'
            }
            New-Item -ItemType Directory -Path $userRoot | Out-Null
            & icacls.exe $userRoot /inheritance:r /grant:r `
              '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' `
              "${env:COMPUTERNAME}\${userName}:(OI)(CI)M"
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant the standard-user work ACL.' }

            Expand-Archive -LiteralPath '${{ steps.windows_candidate.outputs.archive }}' `
              -DestinationPath $readOnlyRoot
            $runnerScript = Join-Path $userRoot 'run-acceptance.ps1'
            $runnerOutput = Join-Path $userRoot 'stdout.log'
            $runnerError = Join-Path $userRoot 'stderr.log'
            $runnerPass = Join-Path $userRoot 'acceptance.pass'
            $script = @'
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $principal = New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Candidate acceptance is running with an elevated token.'
          }
          $env:TEMP = 'C:\rbcsp-standard-user\temp'
          $env:TMP = $env:TEMP
          $env:BCSP_BROWSER_EXECUTABLE = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null

          $readOnlyExecutable = 'C:\rbcsp-final-candidate\read-only-package\RBCSP.exe'
          $startInfo = New-Object Diagnostics.ProcessStartInfo
          $startInfo.FileName = $readOnlyExecutable
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.EnvironmentVariables['BCSP_CI_NO_RUTGERS'] = '1'
          $readOnly = New-Object Diagnostics.Process
          $readOnly.StartInfo = $startInfo
          if (-not $readOnly.Start()) { throw 'Read-only-root candidate did not start.' }
          if (-not $readOnly.WaitForExit(10000)) {
            $readOnly.Kill()
            throw 'Read-only-root candidate did not fail fast.'
          }
          $diagnostic = $readOnly.StandardOutput.ReadToEnd() + $readOnly.StandardError.ReadToEnd()
          if ($readOnly.ExitCode -eq 0 -or
              $diagnostic -notmatch 'writable folder' -or
              $diagnostic -notmatch 'Trace ID:') {
            throw "Read-only-root diagnostic was not actionable: $diagnostic"
          }
          if (Test-Path -LiteralPath 'C:\rbcsp-final-candidate\read-only-package\data') {
            throw 'Read-only-root launch created a data directory.'
          }

          & 'C:\rbcsp-final-candidate\tools\packaging\windows\verify.ps1' `
            -ArchivePath 'C:\rbcsp-final-candidate\release\rbcsp-windows-x86_64-0.1.0.zip' `
            -DumpBinPath '${{ steps.windows_candidate.outputs.dumpbin }}' `
            -BrowserSmokeScript 'C:\rbcsp-final-candidate\tools\packaging\tests\final-candidate-browser.mjs' `
            -PlaywrightRoot 'C:\rbcsp-final-candidate\source\frontend' `
            -NodePath '__NODE_PATH__'
          [IO.File]::WriteAllText(
            'C:\rbcsp-standard-user\acceptance.pass', 'PASS',
            (New-Object Text.UTF8Encoding($false))
          )
          '@
            $node = (Get-Command node.exe).Source
            $script = $script.Replace('__NODE_PATH__', $node.Replace("'", "''"))
            [IO.File]::WriteAllText($runnerScript, $script, (New-Object Text.UTF8Encoding($false)))
            $process = Start-Process `
              -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -Credential $credential -ArgumentList @(
                '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
                '-File', $runnerScript
              ) -RedirectStandardOutput $runnerOutput -RedirectStandardError $runnerError `
              -PassThru
            if (-not $process.WaitForExit(1200000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Standard-user candidate acceptance exceeded 20 minutes.'
            }
            $process.WaitForExit()
            Get-Content -LiteralPath $runnerOutput
            if (Test-Path -LiteralPath $runnerError) { Get-Content -LiteralPath $runnerError }
            if (-not (Test-Path -LiteralPath $runnerPass -PathType Leaf) -or
                [IO.File]::ReadAllText($runnerPass) -cne 'PASS') {
              throw 'Standard-user candidate acceptance did not publish its PASS marker.'
            }
          }
          finally {
            Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          }

      - name: Probe Microsoft Defender and scan when available
        id: defender
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status -and $status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath '${{ steps.windows_candidate.outputs.archive }}'
            Start-MpScan -ScanType CustomScan -ScanPath `
              'C:\rbcsp-final-candidate\read-only-package\RBCSP.exe'
            if (@(Get-MpThreatDetection -ErrorAction SilentlyContinue).Count -ne 0) {
              throw 'Microsoft Defender reported a candidate threat.'
            }
            [IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT, "scanner=MICROSOFT_DEFENDER`n", (New-Object Text.UTF8Encoding($false))
            )
          }
          else {
            Write-Output 'Microsoft Defender is unavailable on this hosted runner; equivalent scan follows in Ubuntu.'
            [IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT, "scanner=HOSTED_DEFENDER_UNAVAILABLE`n", (New-Object Text.UTF8Encoding($false))
            )
          }

      - name: Upload the verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: rbcsp-windows-x86_64-0.1.0
          path: ${{ steps.windows_candidate.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  targeted-product-test:
    if: github.event_name != 'workflow_dispatch' || !inputs.p75_linux_real_world
    name: Targeted fake-upstream product flow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BCSP_CI_NO_RUTGERS: '1'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run the targeted product test
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo test --locked -p bcsp-application --test refresh_coordinator \
            fake_upstream_drives_all_product_routes_and_watch_without_client_amplification \
            -- --exact --nocapture

  p75-linux-real-world:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.p75_linux_real_world &&
      github.ref == 'refs/heads/codex/p7-implementation'
    name: Linux real-world browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out only the acceptance harness
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select the locked Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Restore the frozen accepted Linux candidate
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/rbcsp-release/rbcsp-linux-x86_64-0.1.0.tar.gz
          key: p7-5-linux-candidate-6d1f5a14d15459f418910935ee62012d1168a63fc69ff04dbac66e02d7c31d2b-29444462718-1
          fail-on-cache-miss: true

      - name: Install browser and host tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates caddy libnss3-tools sqlite3
          sudo systemctl disable --now caddy.service >/dev/null 2>&1 || true
          npm ci --prefix frontend --no-audit --no-fund
          frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify and extract the exact candidate without rebuilding it
        run: |
          archive="$RUNNER_TEMP/rbcsp-release/rbcsp-linux-x86_64-0.1.0.tar.gz"
          candidate="$RUNNER_TEMP/rbcsp-live-candidate"
          test "$(sha256sum "$archive" | awk '{print $1}')" = \
            '6d1f5a14d15459f418910935ee62012d1168a63fc69ff04dbac66e02d7c31d2b'
          test "$(stat -c '%s' "$archive")" -eq 6424513
          install -d "$candidate"
          tar -xzf "$archive" -C "$candidate" --no-same-owner
          test "$(find "$candidate" -type f | wc -l)" -eq 20
          (cd "$candidate" && sha256sum --check --strict SHA256SUMS >/dev/null)
          test ! -e "$candidate/data"

      - name: Install the real candidate and start trusted Caddy HTTPS
        run: |
          candidate="$RUNNER_TEMP/rbcsp-live-candidate"
          test ! -e /opt/bcsp
          test ! -e /etc/bcsp
          test ! -e /var/lib/bcsp
          ! id -u bcsp >/dev/null 2>&1
          test -z "${BCSP_CI_NO_RUTGERS:-}"
          date +%s > "$RUNNER_TEMP/rbcsp-live-start-epoch"
          rm -f "$RUNNER_TEMP/rbcsp-live-deadline"
          printf '%s\n' \
            '#!/bin/sh' \
            "touch '$RUNNER_TEMP/rbcsp-live-deadline'" \
            'systemctl stop bcsp.service' > "$RUNNER_TEMP/rbcsp-live-hard-stop.sh"
          chmod 0755 "$RUNNER_TEMP/rbcsp-live-hard-stop.sh"
          sudo systemd-run --quiet \
            --unit=bcsp-p75-hard-stop \
            --on-active=480s \
            --timer-property=AccuracySec=1s \
            "$RUNNER_TEMP/rbcsp-live-hard-stop.sh"
          printf '%s\n' 'BCSP_PUBLIC_ORIGIN=https://planner.test' > "$RUNNER_TEMP/bcsp.env"
          sudo env \
            BCSP_ENV_SOURCE="$RUNNER_TEMP/bcsp.env" \
            BCSP_HEALTH_ATTEMPTS=60 \
            BCSP_HEALTH_DELAY_SECONDS=1 \
            bash "$candidate/ops/install.sh" p7-5-real-world "$candidate"
          sudo bash /opt/bcsp/current/ops/verify.sh

          awk '
            /^planner\.invalid[[:space:]]*\{$/ {
              replacements += 1
              print "planner.test {"
              print "\ttls internal"
              next
            }
            { print }
            END { if (replacements != 1) exit 42 }
          ' "$candidate/caddy/Caddyfile.example" > "$RUNNER_TEMP/Caddyfile.real-world"
          caddy validate --config "$RUNNER_TEMP/Caddyfile.real-world" --adapter caddyfile >/dev/null
          if getent hosts planner.test >/dev/null 2>&1; then
            printf '%s\n' 'planner.test unexpectedly resolves before the test' >&2
            exit 1
          fi
          printf '%s\n' '127.0.0.1 planner.test # bcsp-p75-real-world' | sudo tee -a /etc/hosts >/dev/null
          NO_PROXY="${NO_PROXY:+$NO_PROXY,}planner.test,127.0.0.1,localhost"
          no_proxy="$NO_PROXY"
          export NO_PROXY no_proxy
          sudo env \
            XDG_DATA_HOME="$RUNNER_TEMP/caddy-data" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/caddy-config" \
            caddy start --config "$RUNNER_TEMP/Caddyfile.real-world" --adapter caddyfile

          ca="$RUNNER_TEMP/caddy-data/caddy/pki/authorities/local/root.crt"
          for _ in {1..40}; do
            sudo test -f "$ca" && break
            sleep 0.25
          done
          sudo test -f "$ca"
          sudo install -m 0644 "$ca" /usr/local/share/ca-certificates/bcsp-p75-real-world.crt
          sudo update-ca-certificates >/dev/null
          install -d -m 0700 "$RUNNER_TEMP/browser-home/.pki/nssdb"
          certutil -N --empty-password -d "sql:$RUNNER_TEMP/browser-home/.pki/nssdb"
          certutil -A -d "sql:$RUNNER_TEMP/browser-home/.pki/nssdb" \
            -n bcsp-p75-real-world -t 'C,,' \
            -i /usr/local/share/ca-certificates/bcsp-p75-real-world.crt
          ready=0
          for _ in {1..120}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Host: planner.test' http://127.0.0.1:8080/health/ready || true)"
            if [[ "$status" == 200 ]]; then
              ready=1
              break
            fi
            if [[ -f /var/lib/bcsp/rbcsp.sqlite ]]; then
              unsafe_discovery="$(sudo sqlite3 /var/lib/bcsp/rbcsp.sqlite '.timeout 1000' '
                SELECT count(*) FROM catalog_discovery_observations
                WHERE status = "FAILED"
                  AND error_code IN ("DISCOVERY_UPSTREAM_HTTP", "DISCOVERY_UPSTREAM_PROTOCOL");
              ' 2>/dev/null || true)"
              if [[ "$unsafe_discovery" =~ ^[1-9][0-9]*$ ]]; then
                sudo systemctl stop bcsp.service
                exit 1
              fi
            fi
            test ! -e "$RUNNER_TEMP/rbcsp-live-deadline"
            sleep 1
          done
          test "$ready" -eq 1
          for _ in {1..40}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              https://planner.test/ >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            https://planner.test/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://planner.test/metrics)" = 404

      - name: Run real desktop and mobile browser flows
        env:
          HOME: ${{ runner.temp }}/browser-home
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          database=/var/lib/bcsp/rbcsp.sqlite
          stop_flag="$RUNNER_TEMP/rbcsp-upstream-stop"
          monitor_done="$RUNNER_TEMP/rbcsp-monitor-done"
          deadline_flag="$RUNNER_TEMP/rbcsp-live-deadline"
          test ! -e "$deadline_flag"
          (
            while [[ ! -e "$monitor_done" ]]; do
              if [[ -f "$database" ]]; then
                if ! unsafe="$(sudo sqlite3 "$database" '.timeout 1000' '
                  SELECT
                    (SELECT count(*) FROM catalog_discovery_observations
                      WHERE status = "FAILED"
                        AND error_code IN (
                          "DISCOVERY_UPSTREAM_HTTP", "DISCOVERY_UPSTREAM_PROTOCOL"
                        )) +
                    (SELECT count(*) FROM catalog_refresh_observations
                      WHERE status = "FAILED"
                        AND (
                          error_code = "CATALOG_UPSTREAM_RATE_LIMITED"
                          OR error_stage IN ("SCHEMA", "NORMALIZATION")
                        )) +
                    (SELECT count(*) FROM open_pull_attempts
                      WHERE http_status IN (403, 429)
                         OR classification IN ("UNSAFE_EMPTY", "UNSAFE_ZERO_INTERSECTION")
                         OR (
                           classification = "FAILED"
                           AND COALESCE(error_code, "") NOT IN (
                             "OPEN_TIMEOUT", "OPEN_NETWORK", "OPEN_TRANSIENT_HTTP",
                             "OPEN_CATALOG_UNAVAILABLE_AFTER_FETCH"
                           )
                         )) +
                    (WITH ordered AS (
                      SELECT started_at, effective_interval_seconds, schedule_lag_ms,
                             lag(started_at) OVER (
                               PARTITION BY target_id, lane, effective_interval_seconds
                               ORDER BY attempt_sequence
                             ) AS previous_started_at,
                             lag(schedule_lag_ms) OVER (
                               PARTITION BY target_id, lane, effective_interval_seconds
                               ORDER BY attempt_sequence
                             ) AS previous_schedule_lag_ms
                      FROM open_pull_attempts
                      WHERE lane IN ("GENERAL", "ACTIVE_WATCH")
                        AND effective_interval_seconds IS NOT NULL
                        AND schedule_lag_ms IS NOT NULL
                    ), cadence AS (
                      SELECT effective_interval_seconds,
                             CAST(ROUND(
                               (julianday(started_at) - julianday(previous_started_at))
                                 * 86400000.0
                             ) AS INTEGER) + previous_schedule_lag_ms - schedule_lag_ms
                               AS scheduled_due_interval_ms
                      FROM ordered
                      WHERE previous_started_at IS NOT NULL
                        AND previous_schedule_lag_ms IS NOT NULL
                    )
                    SELECT count(*) FROM cadence
                    WHERE scheduled_due_interval_ms
                      < effective_interval_seconds * 1000 - 250);
                ' 2>/dev/null)"; then
                  touch "$stop_flag"
                  sudo systemctl stop bcsp.service
                  break
                fi
                if [[ "$unsafe" =~ ^[1-9][0-9]*$ ]]; then
                  touch "$stop_flag"
                  sudo systemctl stop bcsp.service
                  break
                fi
              fi
              sleep 1
            done
          ) &
          monitor_pid=$!

          set +e
          node packaging/tests/real-world-browser.mjs \
            --base-url https://planner.test \
            --metrics-url http://127.0.0.1:8080/metrics \
            --playwright-root frontend &
          browser_pid=$!
          while kill -0 "$browser_pid" >/dev/null 2>&1; do
            if [[ -e "$stop_flag" || -e "$deadline_flag" ]]; then
              kill "$browser_pid" >/dev/null 2>&1 || true
              break
            fi
            sleep 1
          done
          wait "$browser_pid"
          browser_status=$?
          set -e
          touch "$monitor_done"
          wait "$monitor_pid" || true
          test ! -e "$stop_flag"
          test ! -e "$deadline_flag"
          test "$browser_status" -eq 0

      - name: Verify real data, centralized polling, and normal cadence
        run: |
          sudo systemctl stop bcsp.service
          database=/var/lib/bcsp/rbcsp.sqlite
          query() { sudo sqlite3 "$database" '.timeout 10000' "$1"; }
          set -x
          test ! -e "$RUNNER_TEMP/rbcsp-live-deadline"
          test "$(query 'PRAGMA integrity_check;')" = ok
          discovery="$(query 'SELECT count(*) FROM catalog_discovery_observations
            WHERE status IN ("APPLIED_CHANGED", "APPLIED_UNCHANGED");')"
          catalog="$(query 'SELECT count(*) FROM catalog_refresh_observations
            WHERE status IN ("APPLIED_CHANGED", "APPLIED_UNCHANGED");')"
          attempts="$(query 'SELECT count(*) FROM open_pull_attempts;')"
          current_open="$(query 'SELECT count(*) FROM open_section_current WHERE state = "OPEN";')"
          test "$discovery" -ge 1
          test "$catalog" -ge 1
          test "$attempts" -ge 1
          test "$current_open" -ge 1
          test "$(query 'SELECT count(*) FROM open_pull_attempts
            WHERE http_status IN (403, 429)
               OR classification IN ("UNSAFE_EMPTY", "UNSAFE_ZERO_INTERSECTION")
               OR (
                 classification = "FAILED"
                 AND COALESCE(error_code, "") NOT IN (
                   "OPEN_TIMEOUT", "OPEN_NETWORK", "OPEN_TRANSIENT_HTTP",
                   "OPEN_CATALOG_UNAVAILABLE_AFTER_FETCH"
                 )
               );')" -eq 0
          test "$(query 'SELECT count(*) FROM catalog_discovery_observations
            WHERE status = "FAILED"
              AND error_code IN ("DISCOVERY_UPSTREAM_HTTP", "DISCOVERY_UPSTREAM_PROTOCOL");')" -eq 0
          test "$(query 'SELECT count(*) FROM catalog_refresh_observations
            WHERE status = "FAILED"
              AND (
                error_code = "CATALOG_UPSTREAM_RATE_LIMITED"
                OR error_stage IN ("SCHEMA", "NORMALIZATION")
              );')" -eq 0
          test "$(query 'SELECT count(DISTINCT target_id) FROM open_pull_attempts
            WHERE lane = "ACTIVE_WATCH" AND effective_interval_seconds = 10;')" -eq 1
          test "$(query 'SELECT count(DISTINCT run_id) FROM open_pull_attempts;')" -eq 1
          general_records="$(query '
            WITH watched(target_id) AS (
              SELECT DISTINCT target_id FROM open_pull_attempts
              WHERE lane = "ACTIVE_WATCH" AND effective_interval_seconds = 10
            )
            SELECT count(*) FROM open_pull_attempts
            WHERE target_id = (SELECT target_id FROM watched)
              AND effective_interval_seconds = 30
              AND classification IN ("VALID_APPLIED", "VALID_EMPTY_NO_ROWS");
          ')"
          watch_records="$(query '
            WITH watched(target_id) AS (
              SELECT DISTINCT target_id FROM open_pull_attempts
              WHERE lane = "ACTIVE_WATCH" AND effective_interval_seconds = 10
            )
            SELECT count(*) FROM open_pull_attempts
            WHERE target_id = (SELECT target_id FROM watched)
              AND lane = "ACTIVE_WATCH" AND effective_interval_seconds = 10
              AND classification IN ("VALID_APPLIED", "VALID_EMPTY_NO_ROWS");
          ')"
          test "$general_records" -ge 1
          test "$watch_records" -ge 2
          IFS='|' read -r minimum_watch_actual_interval_ms \
            minimum_watch_scheduled_due_interval_ms \
            maximum_watch_scheduler_lag_ms <<< "$(query '
            WITH watched(target_id) AS (
              SELECT DISTINCT target_id FROM open_pull_attempts
              WHERE lane = "ACTIVE_WATCH" AND effective_interval_seconds = 10
            ), ordered AS (
              SELECT started_at, schedule_lag_ms,
                     lag(started_at) OVER (ORDER BY attempt_sequence) AS previous_started_at,
                     lag(schedule_lag_ms) OVER (
                       ORDER BY attempt_sequence
                     ) AS previous_schedule_lag_ms
              FROM open_pull_attempts
              WHERE target_id = (SELECT target_id FROM watched)
                AND lane = "ACTIVE_WATCH" AND effective_interval_seconds = 10
                AND schedule_lag_ms IS NOT NULL
            ), cadence AS (
              SELECT schedule_lag_ms,
                     CAST(ROUND(
                       (julianday(started_at) - julianday(previous_started_at))
                         * 86400000.0
                     ) AS INTEGER) AS actual_interval_ms,
                     CAST(ROUND(
                       (julianday(started_at) - julianday(previous_started_at))
                         * 86400000.0
                     ) AS INTEGER) + previous_schedule_lag_ms - schedule_lag_ms
                       AS scheduled_due_interval_ms
              FROM ordered
              WHERE previous_started_at IS NOT NULL
                AND previous_schedule_lag_ms IS NOT NULL
            )
            SELECT min(actual_interval_ms), min(scheduled_due_interval_ms),
                   (SELECT max(schedule_lag_ms) FROM ordered)
            FROM cadence;
          ')"
          test "$minimum_watch_scheduled_due_interval_ms" -ge 9750
          end_epoch="$(date +%s)"
          start_epoch="$(cat "$RUNNER_TEMP/rbcsp-live-start-epoch")"
          duration_seconds="$((end_epoch - start_epoch))"
          test "$duration_seconds" -le 480
          printf 'P7_5_LINUX_REAL_WORLD_DATA_PASS discovery=%s catalog=%s open_attempts=%s current_open=%s general30=%s watched10=%s minimum_watch_actual_interval_ms=%s minimum_watch_scheduled_due_interval_ms=%s maximum_watch_scheduler_lag_ms=%s cadence_tolerance_ms=250 duration_seconds=%s\n' \
            "$discovery" "$catalog" "$attempts" "$current_open" \
            "$general_records" "$watch_records" "$minimum_watch_actual_interval_ms" \
            "$minimum_watch_scheduled_due_interval_ms" "$maximum_watch_scheduler_lag_ms" \
            "$duration_seconds"
          set +x

      - name: Clean the disposable runner
        if: always()
        run: |
          sudo env \
            XDG_DATA_HOME="$RUNNER_TEMP/caddy-data" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/caddy-config" \
            caddy stop >/dev/null 2>&1 || true
          sudo systemctl stop bcsp.service >/dev/null 2>&1 || true
          sudo systemctl disable bcsp.service >/dev/null 2>&1 || true
          sudo systemctl stop bcsp-p75-hard-stop.timer >/dev/null 2>&1 || true
          sudo systemctl reset-failed bcsp-p75-hard-stop.service >/dev/null 2>&1 || true
          sudo sed -i '\|^127\.0\.0\.1 planner\.test # bcsp-p75-real-world$|d' /etc/hosts
          sudo rm -f /usr/local/share/ca-certificates/bcsp-p75-real-world.crt
          sudo update-ca-certificates >/dev/null 2>&1 || true
          sudo rm -rf /opt/bcsp /etc/bcsp /var/lib/bcsp /var/backups/bcsp
          sudo rm -f /etc/systemd/system/bcsp.service
          sudo systemctl daemon-reload >/dev/null 2>&1 || true
          sudo userdel bcsp >/dev/null 2>&1 || true

  malware-scan:
    if: github.event_name != 'workflow_dispatch' || !inputs.p75_linux_real_world
    name: Equivalent malware scan for both candidates
    needs:
      - disposable-ubuntu
      - windows-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Download both accepted candidates
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/candidates

      - name: Scan both candidates with current ClamAV signatures
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clamav
          sudo systemctl stop clamav-freshclam.service || true
          signatures_ready=0
          for attempt in 1 2 3; do
            if sudo freshclam; then
              signatures_ready=1
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$signatures_ready" -eq 1
          test "$(find "$RUNNER_TEMP/candidates" -type f | wc -l)" -eq 2
          clamscan --infected --recursive "$RUNNER_TEMP/candidates"
